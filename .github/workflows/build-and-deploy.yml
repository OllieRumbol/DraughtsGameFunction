name: Build and deploy

on:
  push:
    branches: [master]
  # No path filter. Branch protection requires the check below, and a required check that
  # never runs would stop a documents-only pull request from merging (plan section 8.4).
  pull_request:

permissions:
  contents: read

# A running deploy is never cancelled. If several merges queue, only the newest waits, so the
# newest code deploys. A new push to a pull request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOLUTION_PATH: DraughtsGameFunction.sln
  FUNCTION_PROJECT_PATH: DraughtsGameFunction/DraughtsGameFunction.csproj
  FUNCTION_APP_NAME: func-draughts-game
  PUBLISH_DIRECTORY: publish
  ARTIFACT_NAME: function-app

jobs:
  build:
    # Branch protection requires a check with this exact name (plan section 8.4).
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # NuGet Audit runs on restore. Here its vulnerability warnings are errors, so a vulnerable
      # package stops the build and never deploys (spec section 6.4, item 7). %3B is an escaped semicolon.
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }} -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build

      - name: Publish
        run: dotnet publish ${{ env.FUNCTION_PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_DIRECTORY }}

      - name: Upload the published app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIRECTORY }}
          # The isolated worker needs the hidden .azurefunctions folder.
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    # The federated credential trusts only the subject of a push to master (plan section 8.2).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Do not add environment:. A job with an environment sends a different subject, and the sign-in fails.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the published app
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PUBLISH_DIRECTORY }}

      # Secrets, so that GitHub masks the three ids in this public repository's logs (plan section 6).
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to the Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.PUBLISH_DIRECTORY }}
